# Heap kept modest so the Kotlin compiler + OS still have RAM on this machine.
# (8G was starving the Kotlin daemon → "Could not connect to Kotlin compile daemon".)
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Compile Kotlin INSIDE the Gradle process instead of a separate daemon — the
# daemon connection was failing on this low-memory machine. In-process is slower
# but reliable, so the build actually completes.
kotlin.compiler.execution.strategy=in-process
# Old plugins compile Java/Kotlin at different JVM levels (1.8/11/17). Treat the
# mismatch as a warning instead of a hard error so the build doesn't fail.
kotlin.jvm.target.validation.mode=warning
